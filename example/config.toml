# Paths are relative to this file. Port 443 may require elevated privileges.
[proxy]
ca_cert = "certs/test.crt.pem"
ca_key = "certs/test.key.pem"
listen = ["127.0.0.1:443"]
upstream_port = 443
resolver = "1.1.1.1:53"

# Example routes use reserved test names; replace them with your own targets.
# Each route upstream includes its protocol, host, and nonzero port.
[[route]]
domain = "tls-demo.example.test"
upstream = "tls://192.0.2.20:9443"
verify = false # Skip upstream TLS certificate validation for this route.

[[route]]
domain = "tcp-demo.example.test"
upstream = "tcp://127.0.0.1:8080" # Send decrypted bytes to a plain TCP service.

# For a TLS route with verify = true (the default), you may instead set
# verify_name = "backend.example.test" to verify a different certificate name.
# A route with domain = "*" is a catch-all fallback after exact and *.suffix
# routes. default_host and verify_name must be concrete DNS names.

# To direct a test device's DNS to this host, supply an IP reachable from it.
# [dns]
# listen = "0.0.0.0:53"
# ip = "192.0.2.10"
# all = true
# domains = ["example.com", "*.lab.example.net"] # Used when all = false.
# "example.com" includes the apex and its subdomains; "*.lab.example.net"
# includes subdomains only. "*" matches every name. Matching ignores case.
# Partial-label wildcards such as "api*.example.com" are invalid.

# To stream decrypted PCAP to Wireshark, enable a loopback TCP listener.
# Packets use the client's actual IP:source port and this proxy's accepted
# local IP:listen port as endpoints unless map_port overrides the PCAP port.
# You may use listen, output, or both.
[capture]
listen = "127.0.0.1:57012"
# map_port = 80 # Show the server endpoint as port 80 in PCAP; does not change the proxy listener.
# output = "/tmp/tls-mitm.pcap" # Write PCAP to a file, or to a pre-created FIFO.
